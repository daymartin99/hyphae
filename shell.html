<script>
  // The whole game is one file, so registration only needs a blob of the
  // source the build inlined. Absent in dev, where the plain files are served.
  if ('serviceWorker' in navigator && window.__SW_SOURCE && location.protocol !== 'file:') {
    const url = URL.createObjectURL(new Blob([window.__SW_SOURCE], { type: 'text/javascript' }))
    navigator.serviceWorker.register(url).catch(() => {})
  }
  window.HY && window.HY.boot && window.HY.boot()
</script>
