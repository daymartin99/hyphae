<script>
  // The PWA wiring points at sibling files the build writes next to this
  // document: sw.js, manifest.webmanifest and the icon PNGs. They have to be
  // real files — Chrome rejects blob: service workers outright and cannot
  // resolve start_url or scope from a data: manifest — and real siblings can
  // only exist over http(s). From file:// the document stays fully
  // self-contained and skips the wiring, so one copied file still plays.
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    const link = (rel, href, sizes) => {
      const el = document.createElement('link')
      el.rel = rel
      el.href = href
      if (sizes) el.setAttribute('sizes', sizes)
      document.head.appendChild(el)
    }
    link('manifest', 'manifest.webmanifest')
    // iOS ignores manifest icons entirely; the home screen wants a PNG named
    // by this link, and the build renders one from the same mark.
    link('apple-touch-icon', 'apple-touch-icon.png', '180x180')
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {})
    }
  }
  window.HY && window.HY.boot && window.HY.boot()
</script>
